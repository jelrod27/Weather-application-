# Gitleaks configuration for 16-bit-weather
# https://github.com/gitleaks/gitleaks

title = "16-bit-weather secret scanning rules"

[extend]
# Use the default gitleaks rules as a base
useDefault = true

# Custom rules for project-specific secrets
[[rules]]
id = "sentry-auth-token"
description = "Sentry Authentication Token"
regex = '''sntryu_[a-zA-Z0-9]{64}'''
keywords = ["sntryu_"]

[[rules]]
id = "sentry-system-token"
description = "Sentry System Token"
regex = '''sntrys_[a-zA-Z0-9]{64}'''
keywords = ["sntrys_"]

[[rules]]
id = "supabase-service-role"
description = "Supabase Service Role Key (JWT)"
regex = '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.[a-zA-Z0-9_-]+\.[a-zA-Z0-9_-]+'''
keywords = ["service_role", "supabase"]

[[rules]]
id = "openweather-api-key"
description = "OpenWeatherMap API Key"
# OpenWeather keys are exactly 32 hex characters. The \b anchors stop the
# rule matching a 32-hex substring of a longer hash (a 40-hex commit SHA in
# a doc that also mentions OpenWeather tripped it, 2026-09-04).
regex = '''\b[a-f0-9]{32}\b'''
keywords = ["openweather", "appid"]
entropy = 3.5

[[rules]]
id = "kernel-api-key"
description = "Kernel API Key"
regex = '''kernel_[a-zA-Z0-9_-]{20,}'''
keywords = ["kernel"]

# Allowlist - paths and patterns to ignore
[allowlist]
description = "Global allowlist and ignore false positive Sentry key in Lighthouse generated reports"
paths = [
    '''\.env\.example$''',
    '''\.env\.local\.example$''',
    '''package-lock\.json$''',
    '''node_modules/''',
    '''\.next/''',
    '''test-results/''',
    '''playwright-report/''',
    '''lighthouse\.json'''
]

# Specific strings to ignore (e.g., placeholder values)
regexes = [
    '''your_[a-z_]+_here''',
    '''placeholder''',
    '''test-api-key''',
    '''DEMO_KEY''',
]

commits = [
    "f091ee9530ec59c357c851f1c38a0b81030bf2ef",
