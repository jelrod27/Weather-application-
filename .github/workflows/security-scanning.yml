name: Security Scanning

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 1 * * 0' # Run at 01:30 UTC every Sunday
  workflow_dispatch:

jobs:
  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # Full history for comprehensive scanning

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: false
        continue-on-error: false

      - name: Check for common secret patterns
        run: |
          echo "Checking for hardcoded secrets in tracked files..."

          # Patterns that should never appear in code
          PATTERNS=(
            'sntryu_[a-zA-Z0-9]+'
            'sntrys_[a-zA-Z0-9]+'
            'sk_live_[a-zA-Z0-9]+'
            'sk_test_[a-zA-Z0-9]+'
            'ghp_[a-zA-Z0-9]+'
            'gho_[a-zA-Z0-9]+'
            'github_pat_[a-zA-Z0-9]+'
            'xox[baprs]-[a-zA-Z0-9-]+'
            'AKIA[A-Z0-9]{16}'
          )

          FOUND_SECRETS=0
          for pattern in "${PATTERNS[@]}"; do
            if git grep -nE "$pattern" -- ':!*.example' ':!.gitignore' 2>/dev/null; then
              echo "::error::Found potential secret matching pattern: $pattern"
              FOUND_SECRETS=1
            fi
          done

          if [ $FOUND_SECRETS -eq 1 ]; then
            echo "::error::Secrets detected! Please remove them before merging."
            exit 1
          fi

          echo "✅ No hardcoded secrets detected"

  analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript-typescript', 'actions' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Initialize CodeQL
      uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
      with:
        languages: ${{ matrix.language }}
        build-mode: none
        queries: security-extended,security-and-quality

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
      with:
        # Keep category stable across branches so code scanning can compare
        # against main. It must also be unique per matrix leg, so derive it
        # from the language: the javascript-typescript value is unchanged.
        category: /language:${{ matrix.language }}

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
