name: Vercel Preview Event

# Unprivileged bridge: deployment_status workflows can run from PR branches.
# Never put repository secrets or privileged code in this workflow. The trusted
# workflow_run consumer lives on main and does the actual preview smoke test.
on:
  deployment_status:

permissions: {}

jobs:
  preview-event:
    name: Preview Event
    if: contains(github.event.deployment.environment, 'Preview')
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Notify trusted preview gate
        run: echo 'Preview deployment changed; trusted workflow_run gate will inspect it'
