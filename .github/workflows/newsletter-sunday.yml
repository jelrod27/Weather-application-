name: Newsletter (Sunday Rearview + Roadmap)

on:
  schedule:
    - cron: '0 12 * * 0'  # Sundays at 12:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Generate but do not write the post or open a PR'
        type: boolean
        default: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job holds contents:write and pull-requests:write and runs
          # npm ci before it pushes. Left at the default, checkout writes
          # GITHUB_TOKEN into .git/config, where a dependency's install script
          # could read it. Git is authenticated explicitly at the push instead.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: '8.30.1'
        run: |
          set -euo pipefail
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${asset}"
          curl --fail --location --retry 3 --output "$asset" "$url"
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "$asset" | sha256sum --check -
          tar -xzf "$asset" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Generate Sunday post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEWSLETTER_MODEL: ${{ vars.NEWSLETTER_MODEL || 'claude-sonnet-4-6' }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npx tsx scripts/newsletter/index.ts --cadence sunday --dry-run
          else
            npx tsx scripts/newsletter/index.ts --cadence sunday
          fi

      - name: Detect new post
        id: check
        if: ${{ inputs.dry_run != true }}
        run: |
          if git status --porcelain content/blog/ | grep -q '^??\|^ M\|^M '; then
            echo "new_post=true" >> "$GITHUB_OUTPUT"
            echo "new_file=$(git status --porcelain content/blog/ | awk '{print $2}' | head -1)" >> "$GITHUB_OUTPUT"
          else
            echo "new_post=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate generated post
        if: steps.check.outputs.new_post == 'true'
        env:
          NEW_FILE: ${{ steps.check.outputs.new_file }}
        run: |
          set -o pipefail
          npx tsx scripts/newsletter/validate-post.ts "$NEW_FILE" --audit | tee image-audit.md

      - name: Open PR with the new post
        if: steps.check.outputs.new_post == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_FILE: ${{ steps.check.outputs.new_file }}
        run: |
          BRANCH_DATE=$(date -u +%Y-%m-%d)
          BRANCH_NAME="blog/sun-${BRANCH_DATE}-${GITHUB_RUN_ID}"

          # checkout ran with persist-credentials: false, so the push needs
          # credentials of its own. Scoped to this step rather than the job.
          gh auth setup-git

          git config user.name "16bitbot"
          git config user.email "16bitbot@16bitweather.co"

          git checkout -b "$BRANCH_NAME"
          git add content/blog/

          TITLE=$(grep -m1 '^title:' "$NEW_FILE" 2>/dev/null | sed 's/title: "\?//;s/"\?$//')

          git commit -m "blog: ${TITLE:-This Week in Weather}

          Auto-generated by the newsletter pipeline (Sunday cadence).

          Co-Authored-By: 16bitbot <16bitbot@16bitweather.co>"

          git push origin "$BRANCH_NAME"

          BODY=$(cat <<EOF
          Auto-generated Sunday Rearview + Roadmap.

          **Post:** \`${NEW_FILE}\`

          Generated by \`scripts/newsletter/index.ts --cadence sunday\`. See frontmatter for similarity score, key phrases, model used. Verify Rearview citations against the data before merging.

          $(cat image-audit.md)
          EOF
          )
          # Strip the leading 10-space YAML indent from each body line.
          BODY=$(printf '%s\n' "$BODY" | sed 's/^          //')

          gh pr create \
            --title "blog: ${TITLE:-Sunday rearview ${BRANCH_DATE}}" \
            --body "$BODY" \
            --base main \
            --head "$BRANCH_NAME"
