name: Newsletter (Sunday Rearview + Roadmap)

on:
  schedule:
    - cron: '0 12 * * 0'  # Sundays at 12:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Generate but do not write the post or open a PR'
        type: boolean
        default: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The push and the PR use CONTENT_BOT_TOKEN, not GITHUB_TOKEN, and the
          # job runs npm ci before either. Left at the default, checkout writes
          # GITHUB_TOKEN into .git/config, where a dependency's install script
          # could read it. Git is authenticated explicitly at the push instead.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: '8.30.1'
        run: |
          set -euo pipefail
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${asset}"
          curl --fail --location --retry 3 --output "$asset" "$url"
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "$asset" | sha256sum --check -
          tar -xzf "$asset" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Generate Sunday post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEWSLETTER_MODEL: ${{ vars.NEWSLETTER_MODEL || 'claude-sonnet-4-6' }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npx tsx scripts/newsletter/index.ts --cadence sunday --dry-run
          else
            npx tsx scripts/newsletter/index.ts --cadence sunday
          fi

      - name: Preserve candidate and audit artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: newsletter-sunday-${{ github.run_id }}
          path: |
            newsletter-output/
            content/newsletter-drafts/
            content/newsletter-audits/
          if-no-files-found: warn
          retention-days: 30

      - name: Prepare validated PR inputs
        id: candidate
        if: ${{ inputs.dry_run != true }}
        run: npx tsx scripts/newsletter/workflow-result.ts

      - name: Open PR with the candidate
        if: ${{ inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ secrets.CONTENT_BOT_TOKEN }}
          POST_FILE: ${{ steps.candidate.outputs.post_file }}
          AUDIT_FILE: ${{ steps.candidate.outputs.audit_file }}
          RECEIPT_FILE: ${{ steps.candidate.outputs.receipt_file }}
          OUTCOME: ${{ steps.candidate.outputs.outcome }}
          TITLE: ${{ steps.candidate.outputs.title }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::CONTENT_BOT_TOKEN is not set in the production environment; see .github/GITHUB_SECRETS_REQUIRED.md"
            exit 1
          fi
          BRANCH_NAME="blog/sun-$(date -u +%Y-%m-%d)-${GITHUB_RUN_ID}"
          gh auth setup-git
          git config user.name "16bitbot"
          git config user.email "16bitbot@16bitweather.co"
          git checkout -b "$BRANCH_NAME"
          git add -- "$POST_FILE" "$AUDIT_FILE"
          if [ -n "$RECEIPT_FILE" ]; then git add -- "$RECEIPT_FILE"; fi
          git commit -m "blog: $TITLE"
          git push origin "$BRANCH_NAME"
          DRAFT_ARGS=()
          if [ "$OUTCOME" = "partial" ]; then DRAFT_ARGS+=(--draft); fi
          gh pr create --title "blog: $TITLE" --body-file newsletter-output/pr-body.md \
            --base main --head "$BRANCH_NAME" "${DRAFT_ARGS[@]}"
