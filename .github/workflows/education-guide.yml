name: Education Guide (manual)

# Manual only. The queue is finite — 29 Entry Guides, see planning/adr/0001 —
# so a schedule would open PRs faster than they can be reviewed and then run
# out. Dispatch one when there is someone to read it.
on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Entry slug to write (blank takes the next queued Entry)'
        type: string
        required: false
      kind:
        description: 'Entry kind (cloud, weather-system, phenomenon) when a slug is ambiguous'
        type: string
        required: false
      dry_run:
        description: 'Generate but do not write the Guide or open a PR'
        type: boolean
        default: false

jobs:
  generate:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # This job holds contents:write and pull-requests:write, and runs
          # `npm ci` before it pushes. Left at the default, checkout writes
          # GITHUB_TOKEN into .git/config, where a dependency's install script
          # could read it. Git is authenticated explicitly at the push instead.
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: '8.30.1'
        run: |
          set -euo pipefail
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${asset}"
          curl --fail --location --retry 3 --output "$asset" "$url"
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "$asset" | sha256sum --check -
          tar -xzf "$asset" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Generate Guide
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EDUCATION_MODEL: ${{ vars.EDUCATION_MODEL || 'claude-opus-5' }}
          EDUCATION_EFFORT: ${{ vars.EDUCATION_EFFORT || 'medium' }}
          SLUG: ${{ inputs.slug }}
          KIND: ${{ inputs.kind }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "$SLUG" ]; then args+=(--slug "$SLUG"); else args+=(--next); fi
          if [ -n "$KIND" ]; then args+=(--kind "$KIND"); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          npx tsx scripts/education/index.ts "${args[@]}"

      - name: Detect new Guide
        id: check
        if: ${{ inputs.dry_run != true }}
        run: |
          set -euo pipefail
          # --untracked-files=all because git collapses a wholly-untracked
          # directory to `?? content/education/weather-systems/` and names no
          # file inside it. The first Guide of a kind always creates that
          # directory, so without this the validator is handed a directory path
          # and refuses it. Clouds never hit this: content/education/clouds/
          # was already tracked by the time the generator ran for cirrus.
          #
          # NR==1 rather than `| head -1`: under `set -o pipefail` a SIGPIPE'd
          # awk would fail the step.
          new_file=$(git status --porcelain --untracked-files=all content/education/ | awk 'NR==1{print $2}')
          if [ -n "$new_file" ]; then
            echo "new_guide=true" >> "$GITHUB_OUTPUT"
            echo "new_file=$new_file" >> "$GITHUB_OUTPUT"
          else
            echo "new_guide=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate generated Guide
        if: steps.check.outputs.new_guide == 'true'
        env:
          NEW_FILE: ${{ steps.check.outputs.new_file }}
        run: npx tsx scripts/education/validate-guide.ts "$NEW_FILE"

      - name: Open PR with the new Guide
        if: steps.check.outputs.new_guide == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_FILE: ${{ steps.check.outputs.new_file }}
        run: |
          set -euo pipefail
          SLUG=$(basename "$NEW_FILE" .md)
          BRANCH_NAME="education/guide-${SLUG}-${GITHUB_RUN_ID}"
          TITLE=$(grep -m1 '^title:' "$NEW_FILE" | sed 's/^title: //; s/^"//; s/"$//')

          # checkout ran with persist-credentials: false, so the push needs
          # credentials of its own. Scoped to this step rather than the job.
          gh auth setup-git

          git config user.name "16bitbot"
          git config user.email "16bitbot@16bitweather.co"
          git checkout -b "$BRANCH_NAME"
          git add content/education/
          git commit -m "education: Guide for ${TITLE:-$SLUG}

          Auto-generated by scripts/education/index.ts. Sources and diagram
          placements are from the catalog and registry; prose is model-drafted
          from public-domain NOAA text and needs a human read.

          Co-Authored-By: 16bitbot <16bitbot@16bitweather.co>"
          git push origin "$BRANCH_NAME"

          BODY=$(cat <<EOF
          Auto-generated Entry Guide.

          **Guide:** \`${NEW_FILE}\`

          Generated by \`scripts/education/index.ts\`. Frontmatter records the model, the
          retry count and the word count. Prose is drafted from the public-domain NOAA and
          NWS text the run fetched; the citations and diagram ids come from the catalog and
          the registry, so they resolve by construction.

          $(cat fact-check.md)

          Every claim above that is not flagged was matched to a verbatim quote in the
          source it cites, and the quote was checked against the fetched page rather than
          taken on the model's word. The run fails outright if a number or an agency
          attribution cannot be grounded, so anything left here is prose-level.

          Before merging:

          - [ ] Check any flagged claims above. If there are none, the numbers are grounded.
          - [ ] Check the diagrams land where the prose sets them up.
          - [ ] Add \`reviewed: YYYY-MM-DD\` to the frontmatter once you have read it — the
                generator deliberately does not write it, because it means a person checked
                the prose against the sources. The page prints it and the JSON-LD uses it
                for \`dateModified\`.
          EOF
          )
          BODY=$(printf '%s\n' "$BODY" | sed 's/^          //')

          gh pr create \
            --title "education: Guide for ${TITLE:-$SLUG}" \
            --body "$BODY" \
            --base main \
            --head "$BRANCH_NAME"
