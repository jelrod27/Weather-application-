# yaml-language-server: $schema=https://www.coderabbit.ai/integrations/schema.v2.json
# Review policy: AGENTS.md and CODING.md. Configuration reference:
# https://docs.coderabbit.ai/reference/configuration
language: en-US

reviews:
  profile: chill
  # Keep automatic approval disabled. GitHub conversation-resolution rules still apply.
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_placeholder: "@coderabbitai summary"
  poem: false
  collapse_walkthrough: true
  sequence_diagrams: false
  changed_files_summary: true

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main

  path_instructions:
    - path: "**/*"
      instructions: |
        Read AGENTS.md and CODING.md before reviewing; CODING.md is the engineering
        source of truth. Use package.json for framework versions and scripts.
        For product changes, consult the relevant spec under planning/prds/.
        Report actionable defects with a concrete trigger, impact, and supporting
        code or source. Distinguish confirmed defects from uncertain concerns.
        Focus on correctness, security, accessibility, and regressions. Let existing
        lint/type checks handle routine style diagnostics. Preserve the intentional
        retro aesthetic while checking readability and keyboard access.

    - path: "{app,components,hooks}/**/*.{ts,tsx}"
      instructions: |
        Check hydration using the actual server render and first client render.
        Browser APIs or time-dependent output are defects when they cause a real
        mismatch or server failure; consider existing effects and client boundaries
        before suggesting a mounted guard or disabling SSR.
        Verify effect cleanup, stale closures, and state changes that can loop.
        Follow components/theme-provider.tsx for theme state, lib/theme-config.ts
        for available themes, and app/theme.css for canonical theme tokens.
        Use the installed Next.js documentation for version-specific API claims.

    - path: "app/api/**/*.ts"
      instructions: |
        Trace error handling through lib/api/with-api-route.ts and lib/error-utils.ts.
        A handler covered by withApiRoute does not need a redundant local try/catch.
        Require local recovery only where behavior demands it. Verify input validation,
        appropriate authentication/authorization, rate-limit policy, and the route's
        existing status/error contract. Keep secrets and internal errors out of responses.
        Check user-data access respects ownership and Supabase RLS.

    - path: "lib/**/*.ts"
      instructions: |
        Check missing/null data, units, timestamps, time zones, upstream response
        shapes, and cache freshness against callers and provider contracts.
        Distinguish an unavailable reading from a valid zero. Preserve timeout,
        error-reporting, and rate-limit behavior when changing data clients.

    - path: "app/**/page.tsx"
      instructions: |
        Check route metadata in the page and inherited layouts before reporting it
        missing. Assess loading/error behavior against the route's actual data flow.

    - path: "__tests__/**/*.{ts,tsx}"
      instructions: |
        Prefer deterministic assertions of observable behavior. Bug regressions
        should exercise the failing input or event, not just match source strings.
        Verify mocks represent actual provider response shapes and failure cases.

    - path: "tests/**/*.{ts,tsx}"
      instructions: |
        Prefer Playwright locator assertions and event-based waits over fixed sleeps.
        Check test isolation and meaningful user-visible outcomes. Keep credentials
        out of fixtures, logs, screenshots, and committed test artifacts.

    - path: "content/blog/**/*.md"
      instructions: |
        Verify material weather claims against linked primary sources (NOAA/NWS,
        USGS, or the original forecast provider) when accessible. Distinguish event
        time, report publication time, and forecast validity; state the timezone.
        Check inclusive date windows, location names, units, rankings, and agreement
        between prose, tables, and summaries. A missing feed is not evidence of calm
        conditions or zero activity. If verification is unavailable, describe the
        uncertainty rather than inventing a replacement fact. When a mismatch points
        to generation logic, identify the upstream cause as well as the prose error.

    - path: "scripts/newsletter/**/*.{ts,tsx}"
      instructions: |
        Trace provider data through parsing, prompt context, and generated output.
        Preserve source URLs and event/forecast timestamps in generation context.
        Handle empty, stale, malformed, and changed upstream schemas explicitly;
        never silently turn missing observations into a zero or all-clear claim.
        Check date windows and unit conversions with representative provider fixtures.

    - path: ".github/workflows/*.{yml,yaml}"
      instructions: |
        Read .github/GITHUB_SECRETS_REQUIRED.md for the preview trust boundary.
        Trace event origin, workflow source branch, token permissions, secrets,
        checkout/ref selection, and any execution of PR-controlled code.
        Preserve the checkout-free trusted preview gate and restricted deployment URL.
        Check deployment creator, environment, state, and exact SHA together; GitHub
        environment jobs also create deployment events and string comparisons ignore
        case. Ensure concurrency cannot let unrelated events cancel required checks.
        Evaluate success, failure, skipped, stale, fork, and internal-PR paths, including
        whether a status is posted to the correct commit. Separate production smoke
        detection after deployment from checks that actually prevent merging.

  path_filters:
    - "!**/*.lock"
    - "!**/package-lock.json"
    - "!**/.next/**"
    - "!**/node_modules/**"
    - "!**/playwright-report/**"
    - "!**/test-results/**"
    - "!**/_archive/**"
    - "!**/public/fonts/**"

chat:
  auto_reply: true

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "**/AGENTS.md"
      - "CODING.md"
  learnings:
    scope: auto
  opt_out: false

tone_instructions: >-
  Be concise and actionable. Explain each finding's trigger and impact, cite evidence,
  and label uncertainty. Focus on correctness, security, and accessibility; respect
  the intentional retro design.

early_access: false
